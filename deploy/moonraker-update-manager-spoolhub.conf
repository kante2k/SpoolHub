# Optional Moonraker update_manager block for a git-based SpoolHub install.
# Adjust "origin" to your repository URL before enabling this.

[update_manager spoolhub]
type: git_repo
path: /opt/spoolhub
origin: https://example.invalid/your/spoolhub.git
primary_branch: main
managed_services: spoolhub
install_script: server_install.sh
